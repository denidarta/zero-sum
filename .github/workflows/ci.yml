name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
        working-directory: clients/web
      - run: npm run build
        working-directory: clients/web

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Rust core for Apple platforms
        run: scripts/build-ios-core.sh
      - name: Start a server for the end-to-end tests
        run: |
          cargo build -p zero-sum-server
          ZERO_SUM_ADDR=127.0.0.1:8787 ZERO_SUM_DB="$RUNNER_TEMP/e2e.db" target/debug/zero-sum-server &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8787/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:8787/health  # fail here, with the right error, if it never came up
      - name: Swift tests
        working-directory: clients/ios
        env:
          ZERO_SUM_TEST_SERVER: http://127.0.0.1:8787
        run: swift test
      - name: Build the app for the simulator
        working-directory: clients/ios
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild build -project ZeroSum.xcodeproj -scheme ZeroSum \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: clients/android/tool/test.sh

  # The one step the host tests cannot cover: cross-compile the core for Android,
  # package it, and check the APK carries the library for every ABI.
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: clients/android/tool/build_core.sh
      - run: flutter build apk --debug
        working-directory: clients/android
      - run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep "lib/$abi/libzero_sum_ffi_c.so"
          done
        working-directory: clients/android
