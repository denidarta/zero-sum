name: ZeroSum
options:
  bundleIdPrefix: com.denidarta
  deploymentTarget:
    iOS: "17.0"
packages:
  ZeroSumKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Rust core is built for arm64 simulators only, see scripts/build-ios-core.sh.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  ZeroSum:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ZeroSumKit
        product: ZeroSumKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: zero-sum
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets http:// work for a server on the LAN during development. Over Tailscale use https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denidarta.zerosum
