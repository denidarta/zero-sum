[package]
name = "zero-sum-ffi"
description = "C ABI of zero-sum-core for the Flutter (Android) client, called through dart:ffi."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zero-sum-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
