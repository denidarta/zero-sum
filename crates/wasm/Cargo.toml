[package]
name = "zero-sum-wasm"
description = "WASM bindings of zero-sum-core for the web client."
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zero-sum-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
# Must match the installed wasm-bindgen CLI exactly.
wasm-bindgen = "=0.2.130"
